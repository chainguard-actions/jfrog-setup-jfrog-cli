name: Test ghe_base_url alias input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2.91.0"
          ghe_base_url: "https://github.example.com"
      - name: Assert action ran with ghe_base_url alias input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ghe_base_url alias"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GHE instance available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
