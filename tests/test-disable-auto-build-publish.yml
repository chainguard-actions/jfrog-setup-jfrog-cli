name: Test JFrog CLI with auto build publish disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-auto-build-publish: "true"
          disable-job-summary: "true"
        env:
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is on PATH..."
          if ! command -v jf >/dev/null 2>&1; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          echo "PASS: jf found at $(command -v jf)"
      - name: Assert JFrog CLI can run basic commands
        run: |
          VERSION_OUTPUT=$(jf --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: jf --version returned empty output"
            exit 1
          fi
          echo "PASS: jf CLI is functional"
