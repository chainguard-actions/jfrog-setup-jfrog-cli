name: Test JFrog CLI default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert JFrog CLI default version is installed
        run: |
          echo "Checking jf CLI is on PATH..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT=$(jf --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          # Default version per action.yml is 2.91.0
          if echo "$VERSION_OUTPUT" | grep -q "2.91.0"; then
            echo "PASS: default version 2.91.0 confirmed"
          else
            echo "FAIL: expected default version 2.91.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
