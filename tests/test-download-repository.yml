name: Test download-repository and package-alias-tools inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.91.0"
          download-repository: "jfrog-cli-remote"
          package-alias-tools: "npm,go"
          disable-auto-build-publish: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert JFrog CLI is installed
        run: |
          if ! command -v jf &>/dev/null; then
            echo "FAIL: jf CLI not found in PATH"
            exit 1
          fi
          echo "PASS: jf CLI found"
          jf --version
