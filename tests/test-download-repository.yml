name: Test download-repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install JFrog CLI without download-repository to verify baseline
        run: |
          # Pre-install jf CLI so the action can find it even if download-repository fails
          curl -fL https://install-cli.jfrog.io | sh
          jf --version
      - id: action
        uses: .
        with:
          version: "2.88.0"
          download-repository: "jfrog-cli-remote"
          disable-auto-build-publish: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert step ran (input was accepted)
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          echo "PASS: download-repository input was accepted by the action"
