name: Test download-repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.81.0"
          download-repository: "jfrog-cli-remote"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert step ran (download-repository input accepted)
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          echo "PASS: download-repository input was accepted by the action"
