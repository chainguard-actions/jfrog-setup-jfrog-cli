name: Test package alias with specific tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          enable-package-alias: "true"
          package-alias-tools: " npm , mvn "
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert action succeeded and CLI installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: action did not succeed"; exit 1; }
          command -v jf || { echo "FAIL: jf not on PATH"; exit 1; }
          echo "PASS"
      - name: Assert alias dir on PATH when installed
        run: |
          ALIAS_DIR="$HOME/.jfrog/package-alias/bin"
          if [ -n "$JFROG_CLI_HOME_DIR" ]; then ALIAS_DIR="$JFROG_CLI_HOME_DIR/package-alias/bin"; fi
          echo "alias dir: $ALIAS_DIR"
          echo "PATH: $PATH"
          if [ -d "$ALIAS_DIR" ]; then
            ls -la "$ALIAS_DIR"
            case ":$PATH:" in
              *":$ALIAS_DIR:"*) echo "PASS: alias dir on PATH" ;;
              *) echo "FAIL: alias dir exists but is not on PATH"; exit 1 ;;
            esac
          else
            echo "PASS: package-alias install skipped (non-fatal per action design)"
          fi
