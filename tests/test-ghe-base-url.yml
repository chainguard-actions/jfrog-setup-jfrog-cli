name: Test ghe-base-url and ghe_base_url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.91.0"
          ghe-base-url: "https://github.example.com/api/v3"
          ghe_base_url: "https://github.example.com/api/v3"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert action ran with ghe-base-url and ghe_base_url inputs
        run: |
          echo "Action completed (ghe-base-url and ghe_base_url inputs were accepted)"
          echo "PASS"
