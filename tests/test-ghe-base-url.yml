name: Test ghe-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.91.0"
          ghe-base-url: "https://github.example.com"
          disable-auto-build-publish: "true"
          disable-job-summary: "true"
      - name: Assert JFrog CLI is installed
        run: |
          if ! command -v jf &>/dev/null; then
            echo "FAIL: jf CLI not found"
            exit 1
          fi
          echo "PASS: jf CLI found at $(command -v jf)"
