name: Test ghe-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2.127.0"
          ghe-base-url: "https://github.example.com/api/v3"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
      - name: Assert action ran or failed gracefully
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v jf >/dev/null 2>&1; then
              echo "FAIL: action succeeded but jf CLI not found"
              exit 1
            fi
            echo "PASS: jf CLI installed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with GHE URL in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
