name: Test ghe-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with ghe-base-url input
        id: action
        uses: .
        with:
          version: "2.91.0"
          ghe-base-url: "https://github.example.com/api/v3"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert action ran with ghe-base-url input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail if no GHE server is available,
          # but the input must be accepted and the action must have been invoked
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with ghe-base-url input"
