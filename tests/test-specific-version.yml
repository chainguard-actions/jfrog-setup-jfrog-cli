name: Test JFrog CLI setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "2.127.0"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert JFrog CLI version
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v jf >/dev/null 2>&1; then
              echo "FAIL: jf command not found on PATH"
              exit 1
            fi
            JF_VERSION=$(jf --version 2>&1 || true)
            echo "jf version: $JF_VERSION"
            if echo "$JF_VERSION" | grep -q "2.127.0"; then
              echo "PASS: correct version installed"
            else
              echo "FAIL: expected version 2.127.0 but got: $JF_VERSION"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
