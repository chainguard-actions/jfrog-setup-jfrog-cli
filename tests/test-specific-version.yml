name: Test JFrog CLI specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "2.72.2"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is on PATH..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          echo "PASS: jf is available"
      - name: Assert JFrog CLI version matches requested version
        run: |
          VERSION_OUTPUT=$(jf --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.72.2"; then
            echo "PASS: version 2.72.2 confirmed"
          else
            echo "FAIL: expected version 2.72.2 but got: $VERSION_OUTPUT"
            exit 1
          fi
