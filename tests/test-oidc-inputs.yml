name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2.124.0"
          oidc-provider-name: "test-oidc-provider"
          oidc-audience: "https://github.com/test-org"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
      - name: Assert action ran (OIDC setup attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Verify jf CLI is available
            if ! command -v jf >/dev/null 2>&1; then
              echo "FAIL: jf CLI not found after successful action"
              exit 1
            fi
            echo "PASS: jf CLI installed with OIDC inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real OIDC provider)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
