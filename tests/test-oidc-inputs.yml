name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.91.0"
          oidc-provider-name: "my-oidc-provider"
          oidc-audience: "https://github.com/my-org"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert action ran with oidc-provider-name and oidc-audience inputs
        run: |
          echo "Action completed (oidc-provider-name and oidc-audience inputs were accepted)"
          echo "PASS"
