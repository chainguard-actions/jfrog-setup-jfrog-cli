name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.81.0"
          oidc-provider-name: "test-oidc-provider"
          oidc-audience: "https://github.com/test-org"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert action ran (OIDC may fail without real provider)
        run: |
          echo "Action completed (with or without OIDC token - OIDC requires real provider)"
          echo "PASS: oidc-provider-name and oidc-audience inputs were accepted"
