name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2.91.0"
          oidc-provider-name: "test-oidc-provider"
          oidc-audience: "https://github.com/test-org"
      - name: Assert action ran with oidc inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OIDC_TOKEN: ${{ steps.action.outputs.oidc-token }}
          OIDC_USER: ${{ steps.action.outputs.oidc-user }}
        run: |
          echo "outcome: $OUTCOME"
          echo "oidc-token present: $([ -n "$OIDC_TOKEN" ] && echo yes || echo no)"
          echo "oidc-user present: $([ -n "$OIDC_USER" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with oidc-provider-name and oidc-audience"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real OIDC provider configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
