name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with oidc-provider-name and oidc-audience inputs
        id: action
        uses: .
        with:
          version: "2.91.0"
          oidc-provider-name: "test-oidc-provider"
          oidc-audience: "https://github.com/test-org"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert action ran with oidc inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail because no real OIDC provider is configured,
          # but the inputs must be accepted and the action must have been invoked
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with oidc-provider-name and oidc-audience inputs"
