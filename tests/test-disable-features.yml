name: Test JFrog CLI setup with all features disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-jfrog
        uses: .
        with:
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert jf CLI is installed even with features disabled
        run: |
          echo "Checking jf CLI is available..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found in PATH"
            exit 1
          fi
          echo "PASS: jf is available"
      - name: Assert jf CLI responds to help
        run: |
          OUTPUT=$(jf --help 2>&1 || true)
          echo "jf help output (first line): $(echo "$OUTPUT" | head -1)"
          if echo "$OUTPUT" | grep -qi "jfrog\|jf\|cli"; then
            echo "PASS: jf help output looks correct"
          else
            echo "FAIL: unexpected help output"
            exit 1
          fi
