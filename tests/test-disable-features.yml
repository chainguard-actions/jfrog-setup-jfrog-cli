name: Test JFrog CLI setup with features disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert JFrog CLI is installed despite disabled features
        run: |
          echo "Checking jf binary on PATH..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          echo "PASS: 'jf' is available with features disabled"
      - name: Assert JFrog CLI version output
        run: |
          VERSION_OUTPUT=$(jf --version 2>&1)
          echo "version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qE '^jf version [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: version output looks correct"
