name: Test JFrog CLI with disabled features
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert JFrog CLI is installed with disabled features
        run: |
          echo "Checking if jf binary is available..."
          if command -v jf >/dev/null 2>&1; then
            VERSION=$(jf --version 2>&1 || true)
            echo "PASS: jf is installed: $VERSION"
          else
            echo "FAIL: jf binary not found in PATH"
            exit 1
          fi
