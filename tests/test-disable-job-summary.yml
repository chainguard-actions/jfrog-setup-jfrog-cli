name: Test JFrog CLI with job summary disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-job-summary: "true"
        env:
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is on PATH..."
          if ! command -v jf >/dev/null 2>&1; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          echo "PASS: jf found at $(command -v jf)"
      - name: Assert no job summary file written
        run: |
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-}"
          echo "GITHUB_STEP_SUMMARY: $SUMMARY_FILE"
          if [ -n "$SUMMARY_FILE" ] && [ -f "$SUMMARY_FILE" ]; then
            CONTENT=$(cat "$SUMMARY_FILE" 2>/dev/null || true)
            echo "Summary file content: $CONTENT"
            if echo "$CONTENT" | grep -qi "jfrog"; then
              echo "FAIL: job summary contains JFrog content but disable-job-summary was true"
              exit 1
            fi
          fi
          echo "PASS: no unexpected job summary content"
