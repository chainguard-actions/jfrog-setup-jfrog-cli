name: Test JFrog CLI setup with job summary disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          disable-job-summary: "true"
      - name: Assert JFrog CLI is installed despite disabled job summary
        run: |
          echo "Checking jf CLI is on PATH..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found on PATH"
            exit 1
          fi
          echo "PASS: jf found at $(command -v jf)"
      - name: Assert JFrog CLI version is the default
        run: |
          VERSION_OUTPUT=$(jf --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.81.0"; then
            echo "PASS: default version 2.81.0 installed with job summary disabled"
          else
            echo "FAIL: expected version 2.81.0 in output: $VERSION_OUTPUT"
            exit 1
          fi
