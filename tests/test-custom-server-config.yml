name: Test server configuration with custom server id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          JF_URL: https://example.jfrog.io
          JF_USER: test-user
          JF_PASSWORD: test-password
        with:
          custom-server-id: my-test-server
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert server configured
        run: |
          echo "SETUP_JFROG_CLI_SERVER_IDS=$SETUP_JFROG_CLI_SERVER_IDS"
          if [ "$SETUP_JFROG_CLI_SERVER_IDS" != "my-test-server" ]; then
            echo "FAIL: expected SETUP_JFROG_CLI_SERVER_IDS=my-test-server"
            exit 1
          fi
          OUT="$(jf config show my-test-server 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "example.jfrog.io"; then
            echo "FAIL: server config does not contain configured URL"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "test-user"; then
            echo "FAIL: server config does not contain configured user"
            exit 1
          fi
          echo "PASS"
