name: Test server configuration with JF_URL and custom server ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JF_URL: https://acme.example.com/
      JF_ACCESS_TOKEN: dummy-access-token-for-config-only
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          custom-server-id: my-test-server
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert server ID exported
        run: |
          echo "SETUP_JFROG_CLI_SERVER_IDS=$SETUP_JFROG_CLI_SERVER_IDS"
          case ";$SETUP_JFROG_CLI_SERVER_IDS;" in
            *";my-test-server;"*) echo "PASS" ;;
            *) echo "FAIL: my-test-server not in SETUP_JFROG_CLI_SERVER_IDS"; exit 1 ;;
          esac
      - name: Assert server configured in JFrog CLI
        run: |
          OUT="$(jf config show my-test-server)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "my-test-server"; then
            echo "FAIL: server ID missing from config"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "acme.example.com"; then
            echo "FAIL: URL missing from config"
            exit 1
          fi
          if jf config show setup-jfrog-cli-server >/dev/null 2>&1; then
            echo "FAIL: default server ID should not be configured when custom ID given"
            exit 1
          fi
          echo "PASS"
