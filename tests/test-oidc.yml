name: Test OIDC provider configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          JF_URL: https://example.jfrog.io
        with:
          oidc-provider-name: my-oidc-provider
          oidc-audience: jfrog-github
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert OIDC outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.oidc-token }}
          OIDC_USER: ${{ steps.action.outputs.oidc-user }}
        run: |
          echo "outcome: $OUTCOME"
          echo "oidc-user: $OIDC_USER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOKEN" ]; then
              echo "FAIL: action succeeded but oidc-token output is empty"
              exit 1
            fi
            echo "PASS: OIDC token obtained"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (no GitHub OIDC token / unreachable JFrog platform under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert CLI was installed before the OIDC exchange
        run: |
          command -v jf || { echo "FAIL: jf not on PATH"; exit 1; }
          jf --version
          echo "PASS"
