name: Test oidc-provider-name and oidc-audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2.127.0"
          oidc-provider-name: "test-provider"
          oidc-audience: "https://github.com/test-org"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
      - name: Assert action ran or failed gracefully
        env:
          OIDC_TOKEN: ${{ steps.action.outputs.oidc-token }}
          OIDC_USER: ${{ steps.action.outputs.oidc-user }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "oidc-token present: $([ -n "$OIDC_TOKEN" ] && echo yes || echo no)"
          echo "oidc-user: $OIDC_USER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OIDC_TOKEN" ]; then
              echo "FAIL: action succeeded but oidc-token output is empty"
              exit 1
            fi
            echo "PASS: oidc-token output is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (OIDC provider not configured in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
