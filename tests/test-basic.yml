name: Test basic usage - default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-jfrog
        uses: .
        with:
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is available..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found"
            exit 1
          fi
          echo "PASS: jf is installed"
      - name: Assert JFrog CLI version matches default
        run: |
          VERSION=$(jf --version 2>&1 | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "actual version: $VERSION"
          EXPECTED="2.88.0"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED', got '$VERSION'"
            exit 1
          fi
          echo "PASS: version is $VERSION"
