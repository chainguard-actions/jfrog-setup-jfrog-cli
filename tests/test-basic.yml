name: Test basic install (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert jf and jfrog are on PATH with default version
        run: |
          set -e
          command -v jf || { echo "FAIL: jf not on PATH"; exit 1; }
          command -v jfrog || { echo "FAIL: jfrog not on PATH"; exit 1; }
          OUT="$(jf --version)"
          echo "jf --version: $OUT"
          echo "$OUT" | grep -q "2.131.0" || { echo "FAIL: expected version 2.131.0"; exit 1; }
          OUT2="$(jfrog --version)"
          echo "jfrog --version: $OUT2"
          echo "$OUT2" | grep -q "2.131.0" || { echo "FAIL: expected jfrog version 2.131.0"; exit 1; }
          echo "PASS"
      - name: Assert CLI env vars exported
        run: |
          echo "JFROG_CLI_OFFER_CONFIG=$JFROG_CLI_OFFER_CONFIG"
          echo "JFROG_CLI_AVOID_NEW_VERSION_WARNING=$JFROG_CLI_AVOID_NEW_VERSION_WARNING"
          echo "JFROG_CLI_ENV_EXCLUDE=$JFROG_CLI_ENV_EXCLUDE"
          [ "$JFROG_CLI_OFFER_CONFIG" = "false" ] || { echo "FAIL: JFROG_CLI_OFFER_CONFIG"; exit 1; }
          [ "$JFROG_CLI_AVOID_NEW_VERSION_WARNING" = "true" ] || { echo "FAIL: JFROG_CLI_AVOID_NEW_VERSION_WARNING"; exit 1; }
          echo "$JFROG_CLI_ENV_EXCLUDE" | grep -q "JF_ACCESS_TOKEN" || { echo "FAIL: JFROG_CLI_ENV_EXCLUDE"; exit 1; }
          [ -n "$JFROG_CLI_USER_AGENT" ] || { echo "FAIL: JFROG_CLI_USER_AGENT empty"; exit 1; }
          echo "PASS"
      - name: Assert no server configured without JF_URL
        run: |
          echo "SETUP_JFROG_CLI_SERVER_IDS='$SETUP_JFROG_CLI_SERVER_IDS'"
          if [ -n "$SETUP_JFROG_CLI_SERVER_IDS" ]; then
            echo "FAIL: no server should be configured"
            exit 1
          fi
          echo "PASS"
