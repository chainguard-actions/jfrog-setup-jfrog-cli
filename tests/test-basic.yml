name: Test basic JFrog CLI setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-jfrog
        uses: .
        with:
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"

      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is available..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found in PATH"
            exit 1
          fi
          echo "PASS: jf is available"

      - name: Assert JFrog CLI version output
        run: |
          VERSION_OUTPUT=$(jf --version 2>&1 || true)
          echo "jf version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: jf --version returned empty output"
            exit 1
          fi
          echo "PASS: jf --version returned output"
