name: Test OIDC exchange fails when ID token unavailable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          JF_URL: https://example.invalid
        with:
          oidc-provider-name: "my-provider"
          oidc-audience: "jfrog-github"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert action failed (no OIDC ID token / unreachable platform)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.oidc-token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$TOKEN" ]; then
            echo "FAIL: no oidc-token expected"
            exit 1
          fi
          echo "PASS"
