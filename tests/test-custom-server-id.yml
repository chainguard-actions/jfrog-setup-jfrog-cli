name: Test custom server ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          JF_URL: https://custom.jfrog.io
          JF_USER: custom-user
          JF_PASSWORD: custom-password
        with:
          custom-server-id: my-custom-server
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
      - name: Assert custom server ID exported
        run: |
          echo "SETUP_JFROG_CLI_SERVER_IDS=$SETUP_JFROG_CLI_SERVER_IDS"
          if [ "$SETUP_JFROG_CLI_SERVER_IDS" != "my-custom-server" ]; then
            echo "FAIL: expected my-custom-server"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom server configured in JFrog CLI
        run: |
          OUT="$(jf config show my-custom-server)"
          echo "$OUT"
          echo "$OUT" | grep -q "custom.jfrog.io" || { echo "FAIL: URL not configured"; exit 1; }
          if jf config show setup-jfrog-cli-server >/dev/null 2>&1; then
            echo "FAIL: default server ID should not be configured"
            exit 1
          fi
          echo "PASS"
