name: Test JFrog CLI setup with custom server ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-jfrog
        uses: .
        with:
          custom-server-id: "my-custom-server"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert jf CLI is installed
        run: |
          echo "Checking jf CLI is available..."
          if ! command -v jf &>/dev/null; then
            echo "FAIL: 'jf' command not found in PATH"
            exit 1
          fi
          echo "PASS: jf is available"
      - name: Assert jf CLI version output is valid
        run: |
          VERSION=$(jf --version 2>&1 || true)
          echo "jf version output: $VERSION"
          if echo "$VERSION" | grep -qE "jf version [0-9]+\.[0-9]+\.[0-9]+"; then
            echo "PASS: jf version output looks correct"
          else
            echo "FAIL: unexpected version output: $VERSION"
            exit 1
          fi
