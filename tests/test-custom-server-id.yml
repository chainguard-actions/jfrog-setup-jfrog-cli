name: Test custom-server-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom-server-id
        id: action
        uses: .
        with:
          version: "2.91.0"
          custom-server-id: "my-custom-server"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true
      - name: Assert action ran with custom-server-id input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail if no JFrog server is configured, but the input must be accepted
          # We just verify the action was invoked (not skipped) and the input was passed
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom-server-id input"
