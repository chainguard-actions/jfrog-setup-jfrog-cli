name: Test JFrog CLI setup with custom server ID and GHE base URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          version: "2.81.0"
          custom-server-id: "my-custom-server"
          ghe-base-url: "https://github.example.com"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
        continue-on-error: true

      - name: Assert JFrog CLI is installed
        run: |
          echo "Checking jf CLI is available..."
          which jf || { echo "FAIL: jf not found in PATH"; exit 1; }
          echo "PASS: jf found at $(which jf)"

      - name: Assert JFrog CLI version
        run: |
          VERSION=$(jf --version 2>&1)
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -q "2.81.0"; then
            echo "FAIL: expected version 2.81.0 in output: $VERSION"
            exit 1
          fi
          echo "PASS: version matches 2.81.0"
