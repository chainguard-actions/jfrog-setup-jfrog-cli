name: Test custom-server-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.91.0"
          custom-server-id: "my-custom-server"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"
          disable-job-summary: "true"
        continue-on-error: true
      - name: Assert action ran with custom-server-id input
        run: |
          echo "Action completed (custom-server-id input was accepted)"
          echo "PASS"
