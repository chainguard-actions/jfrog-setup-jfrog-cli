name: Test OIDC inputs are ignored when JF_URL is absent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          oidc-provider-name: my-oidc-provider
          oidc-audience: jfrog-github
      - name: Assert CLI installed
        run: |
          command -v jf || { echo "FAIL: jf not on PATH"; exit 1; }
          OUT="$(jf --version)"
          echo "jf --version: $OUT"
          echo "$OUT" | grep -q "2.130.0" || { echo "FAIL: expected 2.130.0"; exit 1; }
          echo "PASS"
      - name: Assert no OIDC outputs and no server configured
        env:
          TOKEN: ${{ steps.action.outputs.oidc-token }}
          OUSER: ${{ steps.action.outputs.oidc-user }}
        run: |
          echo "oidc-user: '$OUSER'"
          echo "SETUP_JFROG_CLI_SERVER_IDS='$SETUP_JFROG_CLI_SERVER_IDS'"
          if [ -n "$TOKEN" ] || [ -n "$OUSER" ]; then
            echo "FAIL: expected empty OIDC outputs without JF_URL"
            exit 1
          fi
          if [ -n "$SETUP_JFROG_CLI_SERVER_IDS" ]; then
            echo "FAIL: expected no server IDs"
            exit 1
          fi
          echo "PASS"
