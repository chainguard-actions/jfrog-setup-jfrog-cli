name: Test JFrog CLI setup with disable flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          version: "2.81.0"
          disable-job-summary: "true"
          disable-auto-build-publish: "true"
          disable-auto-evidence-collection: "true"

      - name: Assert JFrog CLI is installed and functional
        run: |
          echo "Checking jf CLI is available..."
          which jf || { echo "FAIL: jf not found in PATH"; exit 1; }
          echo "PASS: jf found at $(which jf)"

      - name: Assert JFrog CLI help works
        run: |
          jf --help > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: jf --help returned non-zero exit code"
            exit 1
          fi
          echo "PASS: jf --help succeeded"
