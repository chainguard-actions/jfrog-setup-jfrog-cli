name: Test package alias skipped gracefully for old CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.50.0
          enable-package-alias: "true"
          package-alias-tools: "npm, mvn"
          disable-job-summary: "true"
      - name: Assert CLI installed and alias dir not added to PATH
        run: |
          OUT="$(jf --version)"
          echo "jf --version: $OUT"
          echo "$OUT" | grep -q "2.50.0" || { echo "FAIL: expected 2.50.0"; exit 1; }
          echo "PATH=$PATH"
          case ":$PATH:" in
            *"/.jfrog/package-alias/bin:"*) echo "FAIL: alias dir should not be on PATH"; exit 1 ;;
          esac
          echo "PASS"
