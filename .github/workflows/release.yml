name: "Release"
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Extract Major and Minor Versions from Tag
        id: extract-version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          SAFE_TAG=$(printf '%s' "$TAG_NAME" | tr -d '\n\r')
          # Ensure the tag follows semantic versioning (e.g., v1.2.3)
          if [[ "$SAFE_TAG" =~ ^v([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
            echo "MINOR=$MINOR" >> "$GITHUB_ENV"
            echo "Extracted Major: $MAJOR, Minor: $MINOR"
          else
            echo "Invalid tag format: $SAFE_TAG"
            exit 1
          fi

      - name: Update Major and Minor Tags
        run: |
          # Create or update major version tag
          git tag -f v$MAJOR
          # Create or update minor version tag
          git tag -f v$MAJOR.$MINOR

      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
          force: true
